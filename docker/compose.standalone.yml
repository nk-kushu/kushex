name: kushex

x-backend-build: &backend-build
  context: ..
  additional_contexts:
    kushibot: ../../kushibot
  dockerfile: docker/Dockerfile
  target: backend

x-database-url: &database-url postgresql://kushex:${POSTGRES_PASSWORD:-kushex_local}@postgres:5432/kushex

services:
  frontend:
    build:
      context: ..
      additional_contexts:
        kushibot: ../../kushibot
      dockerfile: docker/Dockerfile
      target: frontend
    ports:
      # Loopback only: the API has no authentication yet (single local operator).
      - "127.0.0.1:3050:80"
    depends_on:
      backend:
        condition: service_healthy

  # Explicit schema migration step (prisma migrate deploy); the backend starts only after it succeeds.
  migrate:
    build: *backend-build
    init: true
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: *database-url
      KUSHEX_WORKSPACES_ROOT: /workspaces
      KUSHEX_PLUGINS_DIR: /plugins
      KUSHEX_ARTIFACTS_DIR: /var/lib/kushex/artifacts
      KUSHEX_ALLOWED_ORIGINS: http://localhost:3050,http://127.0.0.1:3050
      # Agents run from the chat read model credentials from the backend's environment.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # The coding agent uses saved Codex CLI authentication, not an API key.
      CODEX_HOME: /codex
      CODEX_MODEL: ${CODEX_MODEL:-gpt-6.1-sol}
    volumes:
      # Writable directory: Codex refreshes auth.json atomically during use.
      - type: bind
        source: ${KUSHEX_CODEX_HOME_HOST:-${HOME}/.codex}
        target: /codex
        bind:
          create_host_path: false
      - type: bind
        source: ${KUSHEX_WORKSPACES_HOST_ROOT:-../workspaces}
        target: /workspaces
        read_only: false
        bind:
          create_host_path: false
      # Retain recorded changes across backend rebuilds and restarts.
      - coding-artifacts:/var/lib/kushex
      # Plugin packages; writable so the agent editor can save source files.
      - type: bind
        source: ../plugins
        target: /plugins
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Readiness (database reachable, schema current) gates the frontend; /health is liveness.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 15s

  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: kushex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kushex_local}
      POSTGRES_DB: kushex
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kushex -d kushex"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  coding-artifacts:
