name: kushex

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
    ports:
      - "3050:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://kushex:${POSTGRES_PASSWORD:-kushex_local}@postgres:5432/kushex
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 15s

  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: kushex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kushex_local}
      POSTGRES_DB: kushex
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kushex -d kushex"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
